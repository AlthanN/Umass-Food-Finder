<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find dishes served at UMass Amherst dining halls.">
  <title>UMass Food Finder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <main class="container">
    <header class="hero">
      <img class="logo" src="{{ url_for('static', filename='image.png') }}" alt="">
      <div>
        <p class="eyebrow">UMass Dining</p>
        <h1>Find your next craving</h1>
        <p class="subtitle">Search upcoming menus across the four dining commons.</p>
      </div>
    </header>

    <form id="search-form" class="search" role="search" novalidate>
      <div class="search-field">
        <label for="food-name">What are you craving?</label>
        <input
          id="food-name"
          name="foodName"
          type="search"
          placeholder="Try pizza, tofu, or chicken"
          autocomplete="off"
          aria-controls="suggestions"
          aria-autocomplete="list"
          aria-expanded="false"
        >
        <div id="suggestions" class="suggestions" role="listbox" hidden></div>
      </div>
      <button id="search-button" type="submit">Search menus</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite">
      Enter a food name to see where and when it is served.
    </div>

    <section id="results" class="results" aria-label="Search results" hidden>
      {% for location in ["Worcester", "Franklin", "Hampshire", "Berkshire"] %}
      <article class="location" data-location="{{ location }}">
        <h2>{{ location }}</h2>
        <div class="location-results"></div>
      </article>
      {% endfor %}
    </section>
  </main>
</body>
</html>
